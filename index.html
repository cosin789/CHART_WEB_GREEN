<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Area & Urban Climate Dashboard</title>
    <!-- นำเข้า Google Font: Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- นำเข้า Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary-color: #27ae60;
            --primary-light: #e8f8f5;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
        }

        /* Header Styles */
        header {
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            font-weight: 600;
        }

        .header-title p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .status-badge {
            background-color: var(--primary-light);
            color: var(--primary-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Main Content Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .card-header {
            margin-bottom: 20px;
            border-bottom: 1px solid #edf2f7;
            padding-bottom: 12px;
        }

        .card-header h2 {
            font-size: 1.1rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
        }

        /* Footer */
        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .chart-wrapper { height: 300px; }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- ส่วนหัวเว็บ -->
        <header>
            <div class="header-title">
                <h1>Green Area & Urban Climate Dashboard</h1>
                <p>ระบบติดตามข้อมูลสภาพภูมิอากาศเมืองและพื้นที่สีเขียว (Real-time)</p>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span> ระบบออนไลน์ (Live)
            </div>
        </header>

        <!-- ส่วนแสดงกราฟ -->
        <div class="grid-container">
            <div class="card">
                <div class="card-header">
                    <h2>กราฟแสดงแนวโน้มข้อมูล (Time Series Data)</h2>
                </div>
                <div class="chart-wrapper">
                    <canvas id="myChart"></canvas>
                </div>
            </div>
        </div>

        <footer>
            <p>© 2026 Urban Climate & GIS Research Unit | Powered by GitHub Pages</p>
        </footer>
    </div>

    <!-- เรียกใช้ไฟล์ JavaScript แยกต่างหาก -->
    <script src="script.js"></script>
</body>
</html>
